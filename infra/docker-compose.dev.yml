services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    environment:
      - ENVIRONMENT=dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=openlearn
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=openlearn_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
