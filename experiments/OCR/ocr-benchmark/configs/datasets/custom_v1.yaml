# Dataset Config — `custom_v1`

dataset:
  name: custom_v1
  version: 0.2.0
  status: active            # 85 raw samples; canonical identity contract (Phase 2)
  manifest: data/processed/custom/manifest.json   # generated by scripts/build_custom_manifest.py
  sample_unit: one benchmark sample = one PDF page or one standalone image;
               each physical file contributes exactly one logical sample
               (document-level exception: custom_multi_column_004, page=null).
  split: all samples belong to the single "pilot" split (no train/test
         distinction — this is an evaluation-only dataset; nothing here may
         ever be used to tune an engine, an engine is only evaluated against it)

identity_contract:
  # FINAL (Phase 2) — do not reopen:
  canonical_sample_id: exact raw filename stem (case-sensitive, no prefixing,
        no slugification, no case folding)
  invariants:
    - raw filename stem == GT filename stem == metadata key == manifest sample_id
    - duplicate identities are fatal
    - builder metadata-key mismatch is fatal
    - multi-page PDFs must be split first or declared document-level

scope:
  raw_samples: 85
  ground_truth_samples: 85          # all verified (manually reviewed content)
  mixed_language_included: true     # Arabic/English mixed samples are valid
                                    # first-class benchmark samples
  included_document_types: [born_digital_pdf_page, scanned_image,
                            scanned_pdf_page, document_level_pdf]
  languages: [en, ar]

categories:
  # Multi-label canonical taxonomy (a sample may belong to several):
  language_source:
    - english_born_digital      # assigned iff ID contains the token "digital"
    - arabic_born_digital
    - english_scanned           # assigned iff ID lacks the token "digital"
    - arabic_scanned
    - arabic_english_mixed
  layout_content:
    - multi_column
    - tables
    - formulas
    - figures_diagrams
    - slides
    - dense_academic
    - noisy_low_quality
  digital_scanned_rule: literal sample-ID token only ("digital" present ->
        born-digital; absent -> scanned). Folder names, extensions, and
        provenance never override it.

ground_truth:
  root: data/ground_truth/custom
  convention: flat "<sample_id>.txt", one UTF-8 file per sample; no
              per-sample directories, no meta.json
  status: verified             # all 85 files manually reviewed and accepted
  verification_note: "verified" = human content review. Structural checks
        (exists / non-empty / UTF-8 / identity match) are enforced separately
        by scripts/audit_custom_manifest.py.

paths:
  raw_root: data/processed/custom   # relocated from data/raw/custom (raw -> processed migration)
  metadata: configs/custom_manifest_metadata.yaml
  processed_root: data/processed                # generated; gitignored

# Change log
