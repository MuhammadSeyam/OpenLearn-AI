# custom_manifest_metadata.yaml
#
# Manually-maintained semantic metadata for the custom OCR benchmark
# manifest (data/raw/custom/manifest.json).
#
# This file is the ONLY place semantic labels are assigned. The builder
# (scripts/build_custom_manifest.py) never infers language, categories,
# features, evaluation tier, or ground-truth status from folder names or
# file names -- it only reads what's written here, keyed by sample_id.
#
# Entries are looked up by sample_id. If a sample_id has no entry here
# (or a field is omitted), the manifest will contain null / an
# "unassigned" default for that field rather than a guessed value. See
# the exact defaults below.
#
# Run `python3 scripts/build_custom_manifest.py` after editing this file
# to regenerate data/raw/custom/manifest.json. Run
# `python3 scripts/audit_custom_manifest.py` afterward to check
# completeness and catch mistakes (invalid category names, malformed
# language values, etc).
#
# ---------------------------------------------------------------------
# SCHEMA PER ENTRY (all fields optional; omit what you haven't decided)
# ---------------------------------------------------------------------
#
# <sample_id>:
#   language: null | en | ar | [ar, en]
#   categories:
#     - <one or more of the canonical category keys, see below>
#   features:
#     multi_column: null | true | false
#     table:        null | true | false
#     formula:      null | true | false
#     figure:       null | true | false
#     dense:        null | true | false
#     noisy:        null | true | false
#   evaluation:
#     core: true | false        # default if omitted: false
#     extended: true | false    # default if omitted: true
#   ground_truth:
#     status: pending | partial | verified   # default if omitted: pending
#
# CANONICAL CATEGORY KEYS (multi-label -- a sample may have several):
#   english_born_digital
#   arabic_born_digital
#   english_scanned
#   arabic_scanned
#   arabic_english_mixed
#   multi_column
#   tables
#   formulas
#   figures_diagrams
#   slides
#   dense_academic
#   noisy_low_quality
#
# ---------------------------------------------------------------------
# EXAMPLE (uncomment and adapt; check manifest.json / the audit report
# for the real generated sample_ids in your dataset)
# ---------------------------------------------------------------------
#
# custom_custom_english_born_digital_001_p001:
#   language:
#   categories:
#     - english_born_digital
#   features:
#     multi_column: false
#     table: false
#     formula: false
#     figure: false
#     dense: false
#     noisy: false
#   evaluation:
#     core: true
#     extended: true
#   ground_truth:
#     status: pending
#
# ---------------------------------------------------------------------
# CHANGE LOG
# ---------------------------------------------------------------------
# Phase 2: canonical identity contract applied (sample_id = exact raw
#   filename stem); 29 digital/scanned category fixes (ID token rule is
#   authoritative); 6 feature->category additions (feature is
#   authoritative); 18 features blocks repaired from list to mapping.
# Phase 3: ground_truth.status set to "verified" for all 85 samples --
#   the 85 GT text files have been manually reviewed and their content
#   is accepted as correct. "verified" means content review; structural
#   checks (exists / non-empty / UTF-8 / identity match) are enforced
#   separately by scripts/audit_custom_manifest.py.
# ---------------------------------------------------------------------


